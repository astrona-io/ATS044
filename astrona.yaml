# Reading-only course. YAML assessments are registered separately in assessments/index.yaml.
training:
  id: ATS044
  title: 'KCSA: Kubernetes Threat Model'
  description: Concept lessons, diagrams and original scenario assessments covering every published objective
    in this KCSA domain. No labs or playgrounds.
  certification:
    name: Kubernetes and Cloud Native Security Associate
    code: KCSA
    provider: CNCF / Linux Foundation
    domain: Kubernetes Threat Model
    weight: 16
    competencies:
    - Kubernetes Trust Boundaries and Data Flow
    - Persistence
    - Denial of Service
    - Malicious Code Execution and Compromised Applications in Containers
    - Attacker on the Network
    - Access to Sensitive Data
    - Privilege Escalation
