# Course manifest for ATS044 - Kubernetes Threat Model (KCSA).
# Per section: README, then per module the landing page, parts, the lab question and lab, and the summary. The section capstone and quiz close the section.
# Playgrounds are not listed: the landing page's playground marker shows them. solution.md is never listed.
# Every `path:` is relative to this file.
training:
  id: ATS044
  title: 'KCSA: Kubernetes Threat Model'
  description: 'Concept lessons with hands-on playgrounds, graded labs, section capstones
    and knowledge checks covering every published objective in the KCSA Kubernetes
    Threat Model domain. Targets Kubernetes 1.35. All labs are untested: validated
    statically only.'
  certification:
    name: Kubernetes and Cloud Native Security Associate
    code: KCSA
    provider: CNCF / Linux Foundation
    domain: Kubernetes Threat Model
    weight: 16
    competencies:
    - Kubernetes Trust Boundaries and Data Flow
    - Persistence
    - Denial of Service
    - Malicious Code Execution and Compromised Applications in Containers
    - Attacker on the Network
    - Access to Sensitive Data
    - Privilege Escalation
modules:
- id: module-intro
  title: Introduction
  description: Audience, learning approach, reading requirements and contribution
    process.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/README.md
  - type: reading
    title: Welcome To The Course
    path: sections/intro/course-01-welcome.md
  - type: reading
    title: Get Your Machine Ready
    path: sections/intro/course-02-get-your-machine-ready.md
  - type: reading
    title: How This Course Is Made
    path: sections/intro/course-03-how-this-course-is-made.md
