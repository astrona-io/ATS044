# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Privilege Escalation Capstone (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-capstone-070
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: shuttle-cannot-move-authority
      description: shuttle cannot create roles, role bindings or exec
      type: file
      source: validation/validate-shuttle-cannot-move-authority.sh
      hint: Remove the rules for roles, rolebindings and pods/exec from the Role.
    - name: shuttle-keeps-its-task
      description: shuttle can still patch Deployments
      type: file
      source: validation/validate-shuttle-keeps-its-task.sh
      hint: Keep get, list and patch on deployments in the apps group.
    - name: privileged-pods-rejected
      description: a privileged pod and a hostPath pod are rejected in starfleet
      type: file
      source: validation/validate-privileged-pods-rejected.sh
      hint: Label the namespace with pod-security.kubernetes.io/enforce=baseline.
    - name: plain-pod-accepted
      description: a plain pod is accepted in starfleet
      type: file
      source: validation/validate-plain-pod-accepted.sh
      hint: Use the baseline level and not a stricter level.
    - name: workloads-available
      description: The example Deployments are available
      type: file
      source: validation/validate-workloads-available.sh
      hint: Do not delete or scale the workloads.

teardown:
  keepCluster: false
