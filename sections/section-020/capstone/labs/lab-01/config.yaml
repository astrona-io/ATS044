# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Persistence Capstone (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-capstone-020
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: rogue-objects-removed
      description: The CronJob cache-warmer and its cluster-admin binding are gone
      type: file
      source: validation/validate-rogue-objects-removed.sh
      hint: Delete the CronJob and the ClusterRoleBinding that names backup-helper.
    - name: legacy-token-removed
      description: No legacy token Secret exists in starfleet
      type: file
      source: validation/validate-legacy-token-removed.sh
      hint: Delete the Secret of type kubernetes.io/service-account-token.
    - name: node-agent-removed
      description: No pod in outpost mounts a host path
      type: file
      source: validation/validate-node-agent-removed.sh
      hint: Find the Deployment with a hostPath volume in outpost and delete it.
    - name: outpost-enforces-baseline
      description: outpost enforces the baseline Pod Security level
      type: file
      source: validation/validate-outpost-enforces-baseline.sh
      hint: Label the namespace after the host path workload is gone.
    - name: workloads-available
      description: The four example Deployments are available
      type: file
      source: validation/validate-workloads-available.sh
      hint: Remove only the unneeded objects.

teardown:
  keepCluster: false
