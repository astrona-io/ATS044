apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-helper
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-helper-admin
subjects:
  - kind: ServiceAccount
    name: backup-helper
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cache-warmer
  namespace: starfleet
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: backup-helper
          restartPolicy: Never
          containers:
            - name: warmer
              image: curlimages/curl:8.22.0
              command: ["sh", "-c", "curl -s http://probe/get > /dev/null"]
---
apiVersion: v1
kind: Secret
metadata:
  name: shuttle-legacy-token
  namespace: starfleet
  annotations:
    kubernetes.io/service-account.name: shuttle
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-agent
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
        - name: agent
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          volumeMounts:
            - name: node-etc
              mountPath: /host-etc
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
      volumes:
        - name: node-etc
          hostPath:
            path: /etc
