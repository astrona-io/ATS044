# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats044-020
course_id: ATS044
exam_code: KCSA
status: alpha
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-020
  title: Persistence
questions:
- id: ats044-020-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish attacker persistence from ordinary application storage
    persistence
  source_readings:
  - sections/section-020/module-01/course-01-what-can-survive-a-container-replacement.md
  prompt: An incident responder deletes a pod that runs an unwanted image. A new pod
    with the same image appears a few seconds later. What is the most likely cause?
  options:
  - id: a
    text: The node keeps a copy of the pod and restarts it
    explanation: The kubelet only runs pods that the API server assigns to it.
  - id: b
    text: The owning Deployment still holds the unwanted image in its pod template
    explanation: Correct. The controller reconciles the actual state to the desired
      state in the template.
  - id: c
    text: The deleted pod was never removed from etcd
    explanation: Deletion removes the pod object, and the controller creates a new
      one.
  - id: d
    text: kubectl deletes a pod only on one node
    explanation: kubectl deletes the pod object, wherever it runs.
  correct_option: b
  explanation: Persistence is in the desired state, so the fix is the controller,
    not the pod.
- id: ats044-020-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Relate reconciliation to trusted and compromised desired state
  source_readings:
  - sections/section-020/module-01/course-01-what-can-survive-a-container-replacement.md
  prompt: A GitOps tool applies the manifests from a repository. An attacker changed
    the repository. Which statement is correct?
  options:
  - id: a
    text: The tool keeps restoring the attacker's objects after you delete them
    explanation: Correct. Reconciliation repairs toward whatever the source says.
  - id: b
    text: The tool detects the change and refuses it
    explanation: A reconciler applies what the source contains and does not judge
      it.
  - id: c
    text: Deleting the objects once is enough
    explanation: The next reconciliation recreates them.
  - id: d
    text: The tool only reads the cluster
    explanation: A GitOps tool writes to the cluster.
  correct_option: a
  explanation: The source of truth is part of the recovery boundary.
- id: ats044-020-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify durable configuration, identity and data changes that
    survive Pod deletion
  source_readings:
  - sections/section-020/module-01/course-02-finding-and-removing-persistent-objects.md
  prompt: Which search finds a workload that starts only once a day and has no running
    pod between runs?
  options:
  - id: a
    text: Listing running pods only
    explanation: No pod exists between runs.
  - id: b
    text: Listing nodes
    explanation: Nodes do not show workloads that the controllers own.
  - id: c
    text: Listing namespaces
    explanation: Namespaces do not show scheduled jobs.
  - id: d
    text: Listing CronJobs in all namespaces
    explanation: Correct. A CronJob has no pod between runs, so a pod listing does
      not show it.
  correct_option: d
  explanation: Each controller kind needs its own search.
- id: ats044-020-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe recovery that restores inputs and revokes authority
  source_readings:
  - sections/section-020/module-01/course-02-finding-and-removing-persistent-objects.md
  prompt: A suspicious CronJob uses a service account that is bound to `cluster-admin`.
    Which removal order is best?
  options:
  - id: a
    text: Delete only the pod of the current Job
    explanation: The CronJob starts another Job and the binding stays.
  - id: b
    text: Delete the namespace of the CronJob first
    explanation: The ClusterRoleBinding is cluster scoped and stays.
  - id: c
    text: Delete the binding first, then the CronJob
    explanation: Correct. The identity loses authority at once, and the CronJob can
      start no new privileged Job.
  - id: d
    text: Wait for the next run to see what it does
    explanation: Waiting leaves a cluster-admin identity active.
  correct_option: c
  explanation: Remove authority first, then the code that uses it.
- id: ats044-020-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why a long-lived service account token Secret persists
    after a pod is deleted
  source_readings:
  - sections/section-020/module-02/course-01-long-lived-credentials.md
  prompt: A token read from a Secret of type `kubernetes.io/service-account-token`
    has no `exp` claim. What follows?
  options:
  - id: a
    text: It expires when the pod restarts
    explanation: The legacy token is not tied to a pod.
  - id: b
    text: It works until the Secret or the service account is deleted
    explanation: Correct. The API server checks that the Secret still exists.
  - id: c
    text: It expires after one hour
    explanation: Only bound tokens carry an expiry.
  - id: d
    text: It works only from inside the cluster
    explanation: The token is a bearer credential and works from anywhere that can
      reach the API server.
  correct_option: b
  explanation: A token without expiry needs a revocation action.
- id: ats044-020-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Find pods that mount host paths and explain what they can change
    on the node
  source_readings:
  - sections/section-020/module-02/course-02-host-access-and-recovery.md
  prompt: A pod mounts the node directory `/etc` as a hostPath volume with write access.
    Why does deleting the pod not undo its changes?
  options:
  - id: a
    text: The files were written on the node and stay there after the pod is gone
    explanation: Correct. The mount shares the real node filesystem.
  - id: b
    text: The files were copied to etcd
    explanation: etcd stores API objects, not node files.
  - id: c
    text: The pod was recreated on a new node
    explanation: Placement does not change what was written.
  - id: d
    text: The container image keeps the files
    explanation: The change is not in the image.
  correct_option: a
  explanation: Host path writes outlive the pod, so the trusted recovery is node replacement.
