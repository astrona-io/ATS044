# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Persistence Through Credentials And Nodes (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-lab-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: legacy-token-removed
      description: No legacy service account token Secret exists in starfleet
      type: file
      source: validation/validate-legacy-token-removed.sh
      hint: List Secrets with --field-selector type=kubernetes.io/service-account-token and delete the one you find.
    - name: hostpath-workload-removed
      description: No pod in starfleet mounts a host path
      type: file
      source: validation/validate-hostpath-workload-removed.sh
      hint: Find the Deployment that has a hostPath volume and delete it.
    - name: namespace-enforces-baseline
      description: starfleet enforces the baseline Pod Security level
      type: file
      source: validation/validate-namespace-enforces-baseline.sh
      hint: Set the label pod-security.kubernetes.io/enforce=baseline on the namespace.
    - name: workloads-available
      description: The example Deployments are still available
      type: file
      source: validation/validate-workloads-available.sh
      hint: Remove only the unneeded objects.

teardown:
  keepCluster: false
