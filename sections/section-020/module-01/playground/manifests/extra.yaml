apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-helper
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-helper-admin
subjects:
  - kind: ServiceAccount
    name: backup-helper
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cache-warmer
  namespace: starfleet
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: backup-helper
          restartPolicy: Never
          containers:
            - name: warmer
              image: curlimages/curl:8.22.0
              command: ["sh", "-c", "curl -s http://probe/get > /dev/null"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-helper
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: node-helper
  template:
    metadata:
      labels:
        app: node-helper
    spec:
      containers:
        - name: helper
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
