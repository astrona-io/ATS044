# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Trust Boundaries And Data Flow Capstone (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-capstone-010
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: drifter-cannot-read-cluster
      description: drifter has no cluster-wide read access
      type: file
      source: validation/validate-drifter-cannot-read-cluster.sh
      hint: Find the ClusterRoleBinding that names drifter and delete it. Keep the service account.
    - name: shuttle-token-removed
      description: No running shuttle pod mounts a service account token
      type: file
      source: validation/validate-shuttle-token-removed.sh
      hint: Set automountServiceAccountToken to false in the pod template of shuttle.
    - name: probe-cannot-read-secrets
      description: probe cannot read or list Secrets in starfleet
      type: file
      source: validation/validate-probe-cannot-read-secrets.sh
      hint: Find the RoleBinding of probe and remove it. Keep the service account.
    - name: workloads-available
      description: All four Deployments are available
      type: file
      source: validation/validate-workloads-available.sh
      hint: Do not delete the Deployments.

teardown:
  keepCluster: false
