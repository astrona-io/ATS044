# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Assets, Actors And Entry Points (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: starfleet-tokens-removed
      description: No running pod in starfleet mounts a service account token
      type: file
      source: validation/validate-starfleet-tokens-removed.sh
      hint: The token is a projected volume named kube-api-access-*. Set automountServiceAccountToken to false in the pod template of each Deployment.
    - name: outpost-token-removed
      description: The drifter pod in outpost mounts no token
      type: file
      source: validation/validate-outpost-token-removed.sh
      hint: Patch the drifter Deployment the same way as the others.
    - name: workloads-available
      description: All four Deployments are available with the new pods
      type: file
      source: validation/validate-workloads-available.sh
      hint: Do not delete the Deployments. A patch of the pod template starts new pods.

teardown:
  keepCluster: false
