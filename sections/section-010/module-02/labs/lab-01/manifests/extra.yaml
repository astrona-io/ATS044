apiVersion: v1
kind: ConfigMap
metadata:
  name: shuttle-settings
  namespace: starfleet
data:
  mode: standard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: other-settings
  namespace: starfleet
data:
  region: outer-rim
---
apiVersion: v1
kind: Secret
metadata:
  name: probe-db
  namespace: starfleet
type: Opaque
stringData:
  password: change-me-lab-only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shuttle-reader
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shuttle-reader
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: shuttle
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shuttle-reader
