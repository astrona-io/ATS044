# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Trust Boundaries And Request Data Flow (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: shuttle-reads-own-settings
      description: shuttle can read the ConfigMap shuttle-settings
      type: file
      source: validation/validate-shuttle-reads-own-settings.sh
      hint: Use a Role with apiGroups empty string, resources configmaps, verbs get and resourceNames shuttle-settings.
    - name: shuttle-cannot-read-other-data
      description: shuttle cannot read other ConfigMaps, list ConfigMaps or read Secrets
      type: file
      source: validation/validate-shuttle-cannot-read-other-data.sh
      hint: Remove the secrets rule and the list and watch verbs. A resourceNames rule cannot allow list.
    - name: shuttle-binding-kept
      description: The shuttle service account is still bound by a RoleBinding in starfleet and runs
      type: file
      source: validation/validate-shuttle-binding-kept.sh
      hint: Keep the service account and the RoleBinding, and change the Role that it points to.

teardown:
  keepCluster: false
