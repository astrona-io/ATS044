apiVersion: v1
kind: Secret
metadata:
  name: report-db
  namespace: starfleet
type: Opaque
stringData:
  password: orbit-4417
---
apiVersion: v1
kind: Secret
metadata:
  name: shuttle-token
  namespace: starfleet
type: Opaque
stringData:
  token: shuttle-demo-1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shuttle-secrets
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shuttle-secrets
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: shuttle
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shuttle-secrets
