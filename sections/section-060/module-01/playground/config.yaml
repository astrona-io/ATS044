# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Sensitive Data Access Paths (PLAYGROUND). A clean sandbox for free exploration: no task, no grading. Status: UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-044-playground-060-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
    - name: extra
      type: file
      source: manifests/extra.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
