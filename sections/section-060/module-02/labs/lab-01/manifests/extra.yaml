apiVersion: v1
kind: Secret
metadata:
  name: report-db
  namespace: starfleet
type: Opaque
stringData:
  password: orbit-4417
---
apiVersion: v1
kind: Secret
metadata:
  name: shuttle-token
  namespace: starfleet
type: Opaque
stringData:
  token: shuttle-demo-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe
      containers:
        - name: probe
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: report-db
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
