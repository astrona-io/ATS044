# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Limit A Noisy Client And Protect probe (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-lab-030-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: apf-priority-level
      description: The level importer-limited is Limited with a small share and rejects when full
      type: file
      source: validation/validate-apf-priority-level.sh
      hint: Create a PriorityLevelConfiguration named importer-limited with type Limited, nominalConcurrencyShares 5 and limitResponse Reject.
    - name: apf-flow-schema
      description: The FlowSchema importer-flow sends batch-importer to that level
      type: file
      source: validation/validate-apf-flow-schema.sh
      hint: Match the service account batch-importer in starfleet and use a matchingPrecedence between 1000 and 9000.
    - name: probe-budget
      description: A PodDisruptionBudget for probe allows one disruption
      type: file
      source: validation/validate-probe-budget.sh
      hint: Use minAvailable 1 with a selector on app=probe. probe is already scaled to two replicas.
    - name: workloads-available
      description: The example Deployments are available
      type: file
      source: validation/validate-workloads-available.sh
      hint: Do not scale probe below two replicas.

teardown:
  keepCluster: false
