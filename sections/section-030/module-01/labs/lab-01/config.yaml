# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Quota And Defaults For A Namespace (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-lab-030-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: outpost-quota
      description: outpost has a ResourceQuota with a pod limit of 6 or fewer and a memory cap
      type: file
      source: validation/validate-outpost-quota.sh
      hint: Create a ResourceQuota in outpost with hard pods and limits.memory.
    - name: outpost-limitrange
      description: outpost has a LimitRange with default memory request and limit
      type: file
      source: validation/validate-outpost-limitrange.sh
      hint: Create a LimitRange of type Container with defaultRequest and default memory.
    - name: outpost-defaults-applied
      description: A pod without resources is accepted and receives a memory limit
      type: file
      source: validation/validate-outpost-defaults-applied.sh
      hint: The quota needs the defaults from the LimitRange to admit pods that declare nothing.
    - name: workloads-available
      description: The four example Deployments are still available
      type: file
      source: validation/validate-workloads-available.sh
      hint: Do not scale or delete the example workloads.

teardown:
  keepCluster: false
