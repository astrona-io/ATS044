# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Harden A Container With securityContext (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-lab-040-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: drifter-context
      description: The container of drifter has a non-root numeric user, no privilege escalation, dropped capabilities and a read-only root file system
      type: file
      source: validation/validate-drifter-context.sh
      hint: Set runAsNonRoot, runAsUser, allowPrivilegeEscalation, readOnlyRootFilesystem and capabilities.drop in the container securityContext of the Deployment.
    - name: drifter-behaviour
      description: The running drifter process is not root and cannot write to its root file system
      type: file
      source: validation/validate-drifter-behaviour.sh
      hint: Wait for the rollout, then test id -u and a write to /tmp.
    - name: workloads-available
      description: The four example Deployments are available
      type: file
      source: validation/validate-workloads-available.sh
      hint: Keep the command of the container so the pod keeps running.

teardown:
  keepCluster: false
