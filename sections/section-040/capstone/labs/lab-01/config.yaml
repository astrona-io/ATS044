# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Compromised Application Capstone (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-044-capstone-040
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
    nodes:
      workers: 1
    addons:
      cni: calico

# Starting state: the Starfleet workloads plus the faults of this task. The faults stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: shuttle-context
      description: The container of shuttle has a non-root numeric user, no privilege escalation, dropped capabilities and a read-only root file system
      type: file
      source: validation/validate-shuttle-context.sh
      hint: Set the five fields in the container securityContext.
    - name: shuttle-behaviour
      description: The running shuttle process is not root and cannot write to its root file system
      type: file
      source: validation/validate-shuttle-behaviour.sh
      hint: Wait for the rollout, then test id -u and a write.
    - name: drifter-isolated
      description: drifter cannot reach scout and a NetworkPolicy with Egress selects it
      type: file
      source: validation/validate-drifter-isolated.sh
      hint: Create a NetworkPolicy in outpost for app=drifter with no egress rules.
    - name: shuttle-reaches-scout
      description: shuttle can still reach scout
      type: file
      source: validation/validate-shuttle-reaches-scout.sh
      hint: Keep the shuttle service reachable and select only the drifter pods.
    - name: workloads-available
      description: The four example Deployments are available
      type: file
      source: validation/validate-workloads-available.sh
      hint: Keep the shuttle command so the pod runs.

teardown:
  keepCluster: false
