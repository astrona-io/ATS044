apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar
  namespace: starfleet
  labels:
    app: radar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radar
  template:
    metadata:
      labels:
        app: radar
    spec:
      serviceAccountName: scout
      containers:
        - name: radar
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: radar
  namespace: starfleet
spec:
  selector:
    app: radar-v2
  ports:
    - name: http
      port: 80
      targetPort: 8080
